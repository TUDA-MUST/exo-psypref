[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-psypref"
version = "0.1.0"
description = "User preference tuning of exoskeleton assistance with Bayesian adaptive methods from psychophysics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26,<2", "scipy>=1.11", "pandas>=2"]

[project.optional-dependencies]
# Everything the paper's reproduction needs; see REPRODUCE.md.
reproduce = ["cma==4.5.0", "matplotlib", "h5py", "openpyxl", "torch", "gpytorch", "botorch"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["psypref*", "prompref*", "preftune*"]

[tool.setuptools.package-data]
psypref = ["data/*.npz", "data/priors/*.json"]
